# Alembic configuration.
#
# The database URL is deliberately absent: it is supplied at runtime by the
# migration runner from validated application configuration (ADR-028). A URL
# here would be a second source of truth, and the two would eventually disagree.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
